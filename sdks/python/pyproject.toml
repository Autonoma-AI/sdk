[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonoma-sdk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
flask = ["flask>=3.0"]
fastapi = ["fastapi>=0.100", "uvicorn"]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/autonoma", "src/autonoma_sqlalchemy", "src/autonoma_flask", "src/autonoma_fastapi"]
