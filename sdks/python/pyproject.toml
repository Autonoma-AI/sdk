[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonoma-sdk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
flask = ["flask>=3.0"]
fastapi = ["fastapi>=0.100", "uvicorn"]
django = ["django>=4.2"]
postgres = ["psycopg2-binary>=2.9"]
testcontainers = ["testcontainers[postgres]>=4.0", "psycopg2-binary>=2.9"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "testcontainers[postgres]>=4.0", "psycopg2-binary>=2.9"]
all = ["sqlalchemy>=2.0", "flask>=3.0", "fastapi>=0.100", "uvicorn", "django>=4.2", "psycopg2-binary>=2.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/autonoma", "src/autonoma_sqlalchemy", "src/autonoma_flask", "src/autonoma_fastapi", "src/autonoma_django"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
