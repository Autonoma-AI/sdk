[package]
name = "autonoma-sdk"
version = "0.1.0"
edition = "2021"
description = "Autonoma SDK for Rust — automates the Autonoma Environment Factory endpoint"
license = "MIT"
repository = "https://github.com/Autonoma-AI/sdk"
homepage = "https://autonoma.ai"
documentation = "https://docs.rs/autonoma-sdk"
keywords = ["testing", "e2e", "scenario", "automation"]
categories = ["development-tools::testing", "web-programming"]

[features]
default = []
actix = ["dep:actix-web", "dep:actix-rt"]
axum = ["dep:axum"]

[dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Actix Web (optional)
actix-web = { version = "4", optional = true }
actix-rt = { version = "2", optional = true }

# Axum (optional)
axum = { version = "0.8", optional = true }

[[bin]]
name = "conformance_bridge"
path = "bridges/conformance_bridge.rs"

# Protocol-suite server: boots the SDK's Axum adapter with the shared
# `standard` + `empty` scenarios. Built by protocol/run-suites.mjs.
[[bin]]
name = "protocol-server"
path = "../../protocol/servers/rust-server.rs"
required-features = ["axum"]
