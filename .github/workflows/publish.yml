name: Publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      confirm_publish:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release tag to publish
        type: string
        required: true
      confirm_publish:
        description: Publish to external registries
        type: boolean
        default: false
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate: only publish tags that live on main
  # ---------------------------------------------------------------------------
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$INPUT_RELEASE_TAG"
            if [ "$CONFIRM_PUBLISH" != "true" ]; then
              echo "::error::confirm_publish must be true. Run package-preflight.yml for a non-publishing check."
              exit 1
            fi
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          RELEASE_SHA=$(git rev-list -n1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Tag $RELEASE_TAG does not point to a commit on main."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          BRANCH_NAME="release/${RELEASE_TAG}"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::notice::$BRANCH_NAME already exists."
            exit 0
          fi
          git branch "$BRANCH_NAME" "$RELEASE_TAG"
          git push origin "$BRANCH_NAME"

  # ---------------------------------------------------------------------------
  # TypeScript → npm
  # ---------------------------------------------------------------------------
  npm:
    name: Publish to npm
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish packages not already on npm
        run: |
          for PACKAGE in sdk server-web server-express server-hono server-node; do
            NAME=$(node -p "require('./packages/$PACKAGE/package.json').name")
            VERSION=$(node -p "require('./packages/$PACKAGE/package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$VERSION already on npm — skipping."
              continue
            fi
            pnpm --filter "$NAME" publish --access public --no-git-checks
            if [ "$PACKAGE" = "sdk" ]; then
              sleep 10
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # Python → PyPI (Trusted Publishing via OIDC — no token needed)
  # ---------------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Check if version already on PyPI
        id: pypi_check
        run: |
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sSf "https://pypi.org/pypi/autonoma-ai/$VERSION/json" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::autonoma-ai $VERSION already on PyPI — skipping PyPI publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.pypi_check.outputs.already_published == 'false'
        run: poetry build

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.already_published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  # ---------------------------------------------------------------------------
  # Elixir → Hex
  # ---------------------------------------------------------------------------
  hex:
    name: Publish to Hex
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: hex
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/elixir
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get

      - name: Check if version already on Hex
        id: hex_check
        run: |
          VERSION=$(grep -oE '@version "[^"]+"' mix.exs | head -1 | sed 's/@version "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sSf "https://hex.pm/api/packages/autonoma/releases/$VERSION" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::autonoma $VERSION already on Hex — skipping Hex publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to Hex
        if: steps.hex_check.outputs.already_published == 'false'
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # ---------------------------------------------------------------------------
  # Ruby → RubyGems
  # ---------------------------------------------------------------------------
  rubygems:
    name: Publish to RubyGems
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Check if version already on RubyGems
        id: gem_check
        run: |
          VERSION=$(ruby -e "spec = Gem::Specification.load('autonoma-sdk.gemspec'); puts spec.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sS "https://rubygems.org/api/v1/versions/autonoma-ai.json" 2>/dev/null | grep -qF "\"number\":\"$VERSION\""; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::autonoma-ai $VERSION already on RubyGems — skipping RubyGems publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gem
        if: steps.gem_check.outputs.already_published == 'false'
        run: gem build autonoma-sdk.gemspec

      - name: Publish to RubyGems
        if: steps.gem_check.outputs.already_published == 'false'
        run: gem push autonoma-ai-${{ steps.gem_check.outputs.version }}.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  # ---------------------------------------------------------------------------
  # Go → git tag
  #
  # Go has no registry upload: the module proxy pulls straight from a git tag.
  # The v2 Go module lives at github.com/autonoma-ai/sdk/sdks/go/v2 (a submodule of
  # this monorepo), so its version tag MUST carry the subdirectory prefix
  # `sdks/go/` — a plain vX.Y.Z tag would resolve the (non-existent) root
  # module. Consumers still write `@vX.Y.Z`; Go maps it to the prefixed tag.
  # ---------------------------------------------------------------------------
  go-tag:
    name: Tag Go submodule
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: go
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push sdks/go/vX.Y.Z tag
        run: |
          VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          GO_TAG="sdks/go/v${VERSION}"
          git fetch --tags origin
          if git ls-remote --tags origin "refs/tags/${GO_TAG}" | grep -q "${GO_TAG}"; then
            echo "::notice::${GO_TAG} already exists — skipping Go tag."
            exit 0
          fi
          # Anchor the Go tag to the exact commit of the release tag vX.Y.Z so
          # it matches the other SDKs' release; fall back to HEAD if that tag
          # is absent (e.g. a manual dispatch outside the release flow).
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            COMMIT=$(git rev-list -n1 "v${VERSION}")
          else
            COMMIT=$(git rev-parse HEAD)
          fi
          git tag "${GO_TAG}" "${COMMIT}"
          git push origin "${GO_TAG}"
          echo "::notice::Pushed ${GO_TAG} -> ${COMMIT}"

      - name: Warm the Go module proxy (best effort)
        continue-on-error: true
        run: |
          VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          curl -fsS "https://proxy.golang.org/github.com/autonoma-ai/sdk/sdks/go/v2/@v/v${VERSION}.info" \
            && echo "::notice::proxy.golang.org cached github.com/autonoma-ai/sdk/sdks/go/v2@v${VERSION}" \
            || echo "::notice::proxy warm skipped — it will fetch on first go get."

  rust:
    name: Publish to crates.io
    needs: guard
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether the crate version exists
        id: crate
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS "https://crates.io/api/v1/crates/autonoma-sdk/$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crate.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  maven-central:
    name: Publish Java to Maven Central
    needs: guard
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check whether the Java version exists
        id: maven
        run: |
          VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*x-release-please-version.*/\1/p' pom.xml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          URL="https://repo1.maven.org/maven2/ai/autonoma/autonoma-sdk/$VERSION/autonoma-sdk-$VERSION.pom"
          if curl -fsS "$URL" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.maven.outputs.exists == 'false'
        run: mvn --batch-mode --activate-profiles release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  php-split:
    name: Publish PHP split repository
    needs: guard
    runs-on: ubuntu-latest
    environment: packagist
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push the PHP subtree and release tag
        env:
          PHP_SPLIT_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
          RELEASE_TAG: ${{ needs.guard.outputs.release_tag }}
        run: |
          SPLIT_SHA=$(git subtree split --prefix=sdks/php "$RELEASE_TAG")
          REMOTE="https://x-access-token:${PHP_SPLIT_TOKEN}@github.com/Autonoma-AI/sdk-php.git"
          git push "$REMOTE" "$SPLIT_SHA:refs/heads/main"
          if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::$RELEASE_TAG already exists in the PHP split repository."
            exit 0
          fi
          git push "$REMOTE" "$SPLIT_SHA:refs/tags/$RELEASE_TAG"
