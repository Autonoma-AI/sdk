name: Publish

on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate: only publish tags that live on main
  # ---------------------------------------------------------------------------
  guard:
    name: Verify tag is on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit not on main. Skipping publish."
            exit 1
          fi

      - name: Create release branch
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          BRANCH_NAME="release/${TAG_NAME}"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

  # ---------------------------------------------------------------------------
  # TypeScript → npm
  # ---------------------------------------------------------------------------
  npm:
    name: Publish to npm
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check if version already on npm
        id: npm_check
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@autonoma-ai/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@autonoma-ai/sdk@$VERSION already on npm — skipping npm publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @autonoma-ai/sdk
        if: steps.npm_check.outputs.already_published == 'false'
        run: pnpm --filter @autonoma-ai/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for registry propagation
        if: steps.npm_check.outputs.already_published == 'false'
        run: sleep 10

      - name: Publish remaining packages
        if: steps.npm_check.outputs.already_published == 'false'
        run: pnpm -r --filter '!@autonoma-ai/sdk' publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # Python → PyPI (Trusted Publishing via OIDC — no token needed)
  # ---------------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Check if version already on PyPI
        id: pypi_check
        run: |
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sSf "https://pypi.org/pypi/autonoma-ai/$VERSION/json" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::autonoma-ai $VERSION already on PyPI — skipping PyPI publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.pypi_check.outputs.already_published == 'false'
        run: poetry build

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.already_published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  # ---------------------------------------------------------------------------
  # Elixir → Hex
  # ---------------------------------------------------------------------------
  hex:
    name: Publish to Hex
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/elixir
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get

      - name: Check if version already on Hex
        id: hex_check
        run: |
          VERSION=$(grep -oE '@version "[^"]+"' mix.exs | head -1 | sed 's/@version "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sSf "https://hex.pm/api/packages/autonoma/releases/$VERSION" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::autonoma $VERSION already on Hex — skipping Hex publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish to Hex
        if: steps.hex_check.outputs.already_published == 'false'
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
