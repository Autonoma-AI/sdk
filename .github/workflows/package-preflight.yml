name: Package preflight

on:
  pull_request:
    # `main` plus the Scenario-v2 stack branches, so preflight runs on the
    # stacked release PR (based on the previous branch, not `main`). Remove
    # the globs once the stack lands.
    branches: [main, "IgnacioPardo/feat-scenario-v2", "IgnacioPardo/scenario-v2-*"]
  workflow_dispatch:

concurrency:
  group: package-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter './packages/**' --recursive exec pnpm pack --pack-destination "$RUNNER_TEMP/npm"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry twine
      - run: poetry build
      - run: twine check dist/*

  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - run: mix local.hex --force
      - run: mix deps.get
      - run: mix hex.build

  ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem build autonoma-sdk.gemspec

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - run: go test ./...
      - run: test "$(go list -m)" = "github.com/autonoma-ai/sdk/sdks/go/v2"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cmp ../../protocol/version.txt protocol-version.txt
      - run: cargo package --locked

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode package

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer archive --format=zip --dir="$RUNNER_TEMP/php"
