name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # `gh workflow run` dispatches another workflow, which requires the
    # actions:write scope on GITHUB_TOKEN. Without it the dispatch fails with
    # "HTTP 403: Resource not accessible by integration" and nothing publishes.
    permissions:
      actions: write
    steps:
      - name: Dispatch publish.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f release_tag="$RELEASE_TAG" -f confirm_publish=true
