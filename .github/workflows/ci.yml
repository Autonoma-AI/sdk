name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `main` plus the Scenario-v2 stack: each stacked PR is based on the
    # previous branch (not `main`), so without these globs GitHub would not
    # fire CI on the intermediate PRs. Remove the globs once the stack lands.
    branches: [main, "IgnacioPardo/feat-scenario-v2", "IgnacioPardo/scenario-v2-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript
  # ---------------------------------------------------------------------------
  ts-unit:
    name: TypeScript Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: sdks/typescript/node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('sdks/typescript/pnpm-lock.yaml') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ---------------------------------------------------------------------------
  # Python
  # ---------------------------------------------------------------------------
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (all extras)
        run: poetry install --all-extras

      - name: Run all tests
        run: poetry run pytest -v

  # ---------------------------------------------------------------------------
  # Rust
  # ---------------------------------------------------------------------------
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo build
      - run: cargo test
      - run: cargo build --features actix
      - run: cargo build --features axum

  # ---------------------------------------------------------------------------
  # Java
  # ---------------------------------------------------------------------------
  java:
    name: Java Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - run: mvn test -B

  # ---------------------------------------------------------------------------
  # PHP
  # ---------------------------------------------------------------------------
  php:
    name: PHP Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - uses: actions/cache@v4
        with:
          path: sdks/php/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('sdks/php/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Conformance (identical hmac + refs output across every migrated language)
  # ---------------------------------------------------------------------------
  conformance:
    name: Conformance Suite
    runs-on: ubuntu-latest
    needs: [ts-unit, python, rust, java, php]
    steps:
      - uses: actions/checkout@v4

      # Node (for conformance runner + TS bridge)
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      # Python (for Python bridge)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Go (for Go bridge)
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sdks/go/go.sum

      # Install TS deps (conformance runner uses tsx)
      - name: Install TS dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      # Install Python SDK (pip for global access by conformance bridge)
      - name: Install Python SDK
        working-directory: sdks/python
        run: pip install -e .

      # Build Go conformance bridge binary
      - name: Build Go conformance bridge
        working-directory: sdks/go
        run: go build -o bridges/conformance_bridge ./bridges/

      # Rust (for Rust bridge)
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build Rust conformance bridge
        working-directory: sdks/rust
        run: cargo build --release --bin conformance_bridge

      # Java (for Java bridge)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Build Java conformance bridge fat JAR
      - name: Build Java conformance bridge
        working-directory: sdks/java
        run: mvn package -DskipTests -B

      # PHP (for PHP bridge)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      # Install PHP SDK
      - name: Install PHP dependencies
        working-directory: sdks/php
        run: composer install --no-interaction --prefer-dist

      # Install tsx globally for the conformance runner
      - name: Install tsx
        run: npm install -g tsx

      # Run conformance for every bridge registered in runner.config.json
      - name: Run conformance suite
        working-directory: conformance
        run: tsx run.ts

  # ---------------------------------------------------------------------------
  # Protocol suites (HTTP-level, against a live v2 endpoint per migrated SDK)
  # ---------------------------------------------------------------------------
  protocol:
    name: Protocol Suites (v2)
    runs-on: ubuntu-latest
    needs: [ts-unit, python]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Go (builds + boots the Go protocol server).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sdks/go/go.sum

      # Rust (builds + boots the Rust protocol server).
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Ruby (boots the stdlib-only Ruby protocol server; no gems needed).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Java (builds the SDK + boots the JDK HttpServer protocol server).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # PHP (boots the stdlib-only PHP protocol server; it requires the SDK src
      # directly, so no composer install is needed).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      # tsx + the TS SDK source (the servers and runner import it directly).
      - name: Install TS dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      # Python SDK + Flask (the Python protocol server uses the Flask adapter).
      - name: Install Python SDK
        working-directory: sdks/python
        run: pip install -e ".[flask]"

      # Boots the TypeScript, Python, Go, Rust, Ruby, Java, and PHP v2 endpoints
      # and runs protocol/suites/* against each with protocol/test-runner.ts.
      - name: Run protocol suites
        run: PYTHON=python node protocol/run-suites.mjs typescript python go rust ruby java php
