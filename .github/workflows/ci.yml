name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript
  # ---------------------------------------------------------------------------
  ts-unit:
    name: TypeScript Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: sdks/typescript/node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('sdks/typescript/pnpm-lock.yaml') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  ts-integration:
    name: TypeScript Integration Tests
    runs-on: ubuntu-latest
    needs: ts-unit
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: sdks/typescript/node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('sdks/typescript/pnpm-lock.yaml') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Generate Prisma clients for integration tests
        run: |
          npx prisma generate --schema tests/integration/quarita/prisma/schema.prisma
          npx prisma generate --schema tests/integration/navigator/prisma/schema.prisma
          npx prisma generate --schema packages/sdk-prisma/test/prisma/schema.prisma

      - name: Run adapter integration tests (Prisma + Drizzle)
        run: npx vitest run packages/sdk-prisma/test/integration.test.ts packages/sdk-drizzle/test/integration.test.ts --config vitest.integration.config.ts

      - name: Run integration tests (quarita)
        run: npx vitest run tests/integration/quarita/scenarios.test.ts tests/integration/quarita/nested.test.ts --testTimeout 120000

      - name: Run integration tests (navigator)
        run: npx vitest run tests/integration/navigator/e2e.test.ts --testTimeout 120000

  # ---------------------------------------------------------------------------
  # Python
  # ---------------------------------------------------------------------------
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (all extras)
        run: poetry install --all-extras

      - name: Run all tests
        run: poetry run pytest -v

  python-integration:
    name: Python Integration Tests (Postgres)
    runs-on: ubuntu-latest
    needs: python
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Run Postgres integration tests
        run: poetry run pytest tests/test_sqlalchemy_postgres.py -v

  # ---------------------------------------------------------------------------
  # Elixir
  # ---------------------------------------------------------------------------
  elixir:
    name: Elixir Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/elixir
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: actions/cache@v4
        with:
          path: |
            sdks/elixir/deps
            sdks/elixir/_build
          key: mix-${{ runner.os }}-${{ hashFiles('sdks/elixir/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  elixir-integration:
    name: Elixir Integration Tests (Postgres)
    runs-on: ubuntu-latest
    needs: elixir
    defaults:
      run:
        working-directory: sdks/elixir
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: actions/cache@v4
        with:
          path: |
            sdks/elixir/deps
            sdks/elixir/_build
          key: mix-${{ runner.os }}-${{ hashFiles('sdks/elixir/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix compile

      - name: Run Postgres integration tests
        run: mix test --include postgres test/autonoma_ecto/postgres_integration_test.exs

  # ---------------------------------------------------------------------------
  # Java
  # ---------------------------------------------------------------------------
  java:
    name: Java Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - run: mvn test -B

  # ---------------------------------------------------------------------------
  # Rust
  # ---------------------------------------------------------------------------
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo build
      - run: cargo test
      - run: cargo build --features actix
      - run: cargo build --features axum
      - run: cargo build --features sqlx-postgres
      - run: cargo build --features sqlx-mysql

  # ---------------------------------------------------------------------------
  # Conformance (all languages must produce identical output)
  # ---------------------------------------------------------------------------
  conformance:
    name: Conformance Suite
    runs-on: ubuntu-latest
    needs: [ts-unit, python, elixir, java, rust]
    steps:
      - uses: actions/checkout@v4

      # Node (for conformance runner + TS bridge)
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      # Python (for Python bridge)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Elixir (for Elixir bridge)
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      # Java (for Java bridge)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Install TS deps (conformance runner uses tsx)
      - name: Install TS dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      # Install Python SDK (pip for global access by conformance bridge)
      - name: Install Python SDK
        working-directory: sdks/python
        run: pip install -e .

      # Install Elixir deps
      - name: Install Elixir dependencies
        working-directory: sdks/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      # Build Java conformance bridge fat JAR
      - name: Build Java conformance bridge
        working-directory: sdks/java
        run: mvn package -DskipTests -B

      # Rust (for Rust bridge)
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build Rust conformance bridge
        working-directory: sdks/rust
        run: cargo build --release --bin conformance_bridge

      # Install tsx globally for the conformance runner
      - name: Install tsx
        run: npm install -g tsx

      # Run conformance for all languages
      - name: Run conformance suite
        working-directory: conformance
        run: tsx run.ts
