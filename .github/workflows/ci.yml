name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `main` plus the Scenario-v2 stack: each stacked PR is based on the
    # previous branch (not `main`), so without these globs GitHub would not
    # fire CI on the intermediate PRs. Remove the globs once the stack lands.
    branches: [main, "IgnacioPardo/feat-scenario-v2", "IgnacioPardo/scenario-v2-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript
  # ---------------------------------------------------------------------------
  ts-unit:
    name: TypeScript Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: sdks/typescript/node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('sdks/typescript/pnpm-lock.yaml') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ---------------------------------------------------------------------------
  # Conformance (identical hmac + refs output across every migrated language)
  # ---------------------------------------------------------------------------
  conformance:
    name: Conformance Suite
    runs-on: ubuntu-latest
    needs: [ts-unit]
    steps:
      - uses: actions/checkout@v4

      # Node (for conformance runner + TS bridge)
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      # Install TS deps (conformance runner uses tsx)
      - name: Install TS dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      # Install tsx globally for the conformance runner
      - name: Install tsx
        run: npm install -g tsx

      # Run conformance for every bridge registered in runner.config.json
      - name: Run conformance suite
        working-directory: conformance
        run: tsx run.ts

  # ---------------------------------------------------------------------------
  # Protocol suites (HTTP-level, against a live v2 endpoint per migrated SDK)
  # ---------------------------------------------------------------------------
  protocol:
    name: Protocol Suites (v2)
    runs-on: ubuntu-latest
    needs: [ts-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      # tsx + the TS SDK source (the server and runner import it directly).
      - name: Install TS dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      # Boots the TypeScript v2 endpoint and runs protocol/suites/* against it.
      - name: Run protocol suites
        run: node protocol/run-suites.mjs typescript
