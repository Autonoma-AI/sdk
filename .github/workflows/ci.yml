name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `main` plus the Scenario-v2 stack: each stacked PR is based on the
    # previous branch (not `main`), so without these globs GitHub would not
    # fire CI on the intermediate PRs. Remove the globs once the stack lands.
    branches: [main, "IgnacioPardo/feat-scenario-v2", "IgnacioPardo/scenario-v2-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript
  # ---------------------------------------------------------------------------
  ts-unit:
    name: TypeScript Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: sdks/typescript/node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('sdks/typescript/pnpm-lock.yaml') }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ---------------------------------------------------------------------------
  # Conformance (identical hmac + refs output across every migrated language)
  # ---------------------------------------------------------------------------
  conformance:
    name: Conformance Suite
    runs-on: ubuntu-latest
    needs: [ts-unit]
    steps:
      - uses: actions/checkout@v4

      # Node (for conformance runner + TS bridge)
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      # Install TS deps (conformance runner uses tsx)
      - name: Install TS dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      # Install tsx globally for the conformance runner
      - name: Install tsx
        run: npm install -g tsx

      # Run conformance for every bridge registered in runner.config.json
      - name: Run conformance suite
        working-directory: conformance
        run: tsx run.ts

  # ---------------------------------------------------------------------------
  # Protocol suites (HTTP-level, against a live v2 endpoint per migrated SDK)
  #
  # One matrix leg per migrated language: each boots that SDK's own v2 endpoint
  # and runs the shared protocol/suites/* against it via run-suites.mjs. This is
  # the protocol-level analogue of the `conformance` job, which auto-discovers
  # bridges from conformance/runner.config.json.
  #
  # The matrix is the registration point. ADD A LANGUAGE HERE the moment its
  # protocol/servers/<lang> server lands (in that language's stacked PR),
  # together with any extra toolchain setup its server needs — the same way that
  # PR registers its conformance bridge. Until then a language cannot run here:
  # you can't boot e.g. the Go v2 endpoint before the Go v2 server exists. #81
  # (top of the stack) gates that all eight languages are listed, so a broken
  # wire in any language turns this job red instead of surfacing in prod.
  # ---------------------------------------------------------------------------
  protocol:
    name: Protocol Suites (v2) — ${{ matrix.language }}
    runs-on: ubuntu-latest
    needs: [ts-unit]
    strategy:
      fail-fast: false
      matrix:
        # Extend as each language's v2 protocol server lands in its stacked PR.
        language: [typescript]
    steps:
      - uses: actions/checkout@v4

      # Every leg needs Node + the TS workspace deps: run-suites.mjs and
      # test-runner.ts run on tsx regardless of the target language.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml

      - name: Install TS dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile

      # --- Per-language toolchain setup --------------------------------------
      # A stacked language PR adds its setup step(s) here, each guarded by
      # `if: matrix.language == '<lang>'` (e.g. actions/setup-go for Go,
      # erlef/setup-beam for Elixir). run-suites.mjs builds/boots the server.

      # Boots the selected language's v2 endpoint and runs protocol/suites/*.
      - name: Run protocol suites
        run: node protocol/run-suites.mjs ${{ matrix.language }}
