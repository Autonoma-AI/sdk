[package]
name = "autonoma-axum-example"
version = "0.1.0"
edition = "2021"

[dependencies]
autonoma-sdk = { version = "2", features = ["axum"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
